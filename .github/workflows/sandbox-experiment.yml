name: Sandbox experiment
# A temporary experiment on GitHub's free runners, on a scratch branch only. It runs the pull request's own install
# script and sandbox self-test on the image the trial job used for its pilot run (ubuntu-26.04, where ubuntu-latest now
# points) and on the image it is pinned to (ubuntu-24.04), then the after-trial rule on the self-test's own traces. No
# secret, no environment, no model call: the self-test uses a stand-in for the model on 127.0.0.1.
on:
  push:
    branches: [claude/sandbox-experiment]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-26.04, ubuntu-24.04]
    runs-on: ${{ matrix.image }}
    name: ${{ matrix.image }} with the pinned install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Runner facts
        run: |
          uname -r; . /etc/os-release; echo "$PRETTY_NAME"; echo "ImageVersion=${ImageVersion:-unknown}"
          ls -la /etc/apparmor.d | grep -i -E 'bwrap|userns|unpriv' || echo "no bwrap profile file in /etc/apparmor.d"
          sudo aa-status 2>/dev/null | grep -i -E 'bwrap|unpriv' || echo "no bwrap profile loaded"
      - name: Install what the trial job installs
        run: bash .github/scripts/install-trial-tools.sh
      - name: Claude Code's own refusals, as the pinned release writes them
        run: |
          BIN="$(realpath "$(command -v claude)")"
          echo "searching $BIN"
          BIN="$BIN" node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const bin = readFileSync(process.env.BIN).toString('latin1');
          const fragments = [
            'Sandbox is required (sandbox.failIfUnavailable) and stopped being available in this session: ${',
            '. The command was refused, and so is a request to run it outside the sandbox (dangerouslyDisableSandbox): do not retry it that way.',
            'Sandbox is required but failed to initialize${',
            'Fix the sandbox settings to retry (a --settings file is pinned for the process: restart).',
            'Restart to retry."} Running it outside the sandbox (dangerouslyDisableSandbox) is not allowed either.',
            'Sandbox is enabled but failed to initialize${',
            '. Until the sandbox can start, commands that would run in it are refused.',
            '. Sandboxing is disabled for the rest of this session; restart to retry.',
          ];
          let missing = 0;
          for (const f of fragments) { const found = bin.includes(f); if (!found) missing++; console.log(`${found ? 'found  ' : 'MISSING'} ${f}`); }
          process.exit(missing ? 1 : 0);
          EOF
      - name: Bash result shapes in the pinned release, sandbox on, through a stand-in model
        if: ${{ always() }}
        run: |
          # A copy of /usr/bin without socat, for the scenario that hides it.
          mkdir -p "$RUNNER_TEMP/nosocat" && for f in /usr/bin/*; do [ "$(basename "$f")" = socat ] || ln -sf "$f" "$RUNNER_TEMP/nosocat/"; done
          mkdir -p "$RUNNER_TEMP/scenarios"
          NOSOCAT_BIN="$RUNNER_TEMP/nosocat" node .github/experiment/scenarios.mjs "$(cat .github/experiment/linux-scenarios.json)" "$RUNNER_TEMP/scenarios"
      - name: Where the pinned release holds that code
        if: ${{ always() }}
        run: |
          node .github/experiment/source-facts.mjs "$(realpath "$(command -v claude)")"
          ls -la "$(npm root -g)/@anthropic-ai/" 2>&1
          for f in "$(npm root -g)"/@anthropic-ai/claude-code-linux-x64/claude "$(npm root -g)"/@anthropic-ai/claude-code/node_modules/@anthropic-ai/claude-code-linux-x64/claude; do [ -f "$f" ] && sha256sum "$f"; done; sha256sum "$(realpath "$(command -v claude)")"
          npm view @anthropic-ai/claude-code-linux-x64@2.1.322 dist.integrity dist.tarball
      - name: Self-test the sandbox through the agent's own Bash tool
        run: |
          sudo dmesg --clear || true
          node .github/scripts/sandbox-self-test.mjs --model claude-sonnet-5-5
      - name: What AppArmor refused during the self-test
        if: ${{ always() }}
        run: sudo dmesg | grep -i 'apparmor="DENIED"' | tail -5 || echo "nothing refused"
      - name: The after-trial rule on the self-test's own traces and report
        if: ${{ always() }}
        run: node .github/scripts/shell-starts.mjs "$RUNNER_TEMP/sandbox-self-test/tmp" "$RUNNER_TEMP/sandbox-self-test/out/raw.json"
      - name: The complete-trace definition on real traces
        if: ${{ always() }}
        run: |
          echo "self-test traces:"; node .github/experiment/complete.mjs "$RUNNER_TEMP/sandbox-self-test/tmp"
          echo "scenario streams:"; node .github/experiment/complete.mjs "$RUNNER_TEMP/scenarios"
