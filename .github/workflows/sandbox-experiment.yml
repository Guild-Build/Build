name: Sandbox experiment
# A temporary experiment on GitHub's free runners, on a scratch branch only. It runs the pull request's own install
# script and sandbox self-test on the image the trial job used for its pilot run (ubuntu-26.04, where ubuntu-latest now
# points) and on the image it is pinned to (ubuntu-24.04), then the after-trial rule on the self-test's own traces. No
# secret, no environment, no model call: the self-test uses a stand-in for the model on 127.0.0.1.
on:
  push:
    branches: [claude/sandbox-experiment]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-26.04, ubuntu-24.04]
    runs-on: ${{ matrix.image }}
    name: ${{ matrix.image }} with the pinned install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Runner facts
        run: |
          uname -r; . /etc/os-release; echo "$PRETTY_NAME"; echo "ImageVersion=${ImageVersion:-unknown}"
          ls -la /etc/apparmor.d | grep -i -E 'bwrap|userns|unpriv' || echo "no bwrap profile file in /etc/apparmor.d"
          sudo aa-status 2>/dev/null | grep -i -E 'bwrap|unpriv' || echo "no bwrap profile loaded"
      - name: Install what the trial job installs
        run: bash .github/scripts/install-trial-tools.sh
      - name: Self-test the sandbox through the agent's own Bash tool
        run: |
          sudo dmesg --clear || true
          node .github/scripts/sandbox-self-test.mjs --model claude-sonnet-5-5
      - name: What AppArmor refused during the self-test
        if: ${{ always() }}
        run: sudo dmesg | grep -i 'apparmor="DENIED"' | tail -5 || echo "nothing refused"
      - name: The after-trial rule on the self-test's own traces
        if: ${{ always() }}
        run: node .github/scripts/shell-starts.mjs "$RUNNER_TEMP/sandbox-self-test/tmp"
