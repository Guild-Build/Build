name: Season trial
# Runs Season trials: one guild build from bundles/ on one trial as buildguild.gg publishes it, with the official eval
# runner, then uploads the evidence record, the raw report, the results and the agent traces. A maintainer starts it in
# one of two ways: merge a change to .github/trial-queue.json into main (each request in the file becomes one run, or
# `repeat` runs of the same build on the same trial; see "Season trials" in README.md), or dispatch it from the Actions tab
# with the inputs below. A repeated request's runs carry -rep<k> at the end of their evidence id, file names and artifact
# name, so no two collide; a request without repeat names everything as before. Either way each run waits for
# the owner's approval in the `trials` environment before it signs in to Azure or spends anything, and a queue with no
# requests starts nothing. The Anthropic key is read at run time from Azure Key Vault vaultgb01 (secret
# buildguild-anthropic-api-key) through a federated identity; no copy of the key is held on GitHub. This repository is
# public, so anyone signed in to GitHub can read each run's log and download its files. Before upload the files are
# scanned: nothing is uploaded if the key or the workspace id appears in a file or in a file or folder name, or if the
# upload folder holds anything but regular files and folders. The scan looks for each value as one unbroken string
# within a line, so a value split across lines, or encoded (base64, for example), would pass it.
#
# A request's cost ceiling, max_cost_usd, covers every paid call of its run. The plan keeps 0.5 USD of it for the key
# check, one tiny call (two when the key is organisation-level) with a budget of 0.25 USD each, and gives the trial the
# rest. Claude Code holds each budget to its own cost estimate: the key check can pass its budget by the one reply that
# reaches it, and the trial can pass its budget by every agent run already under way when it is reached, up to the
# request's concurrency (1 unless the request says otherwise).
#
# An agent's shell commands run inside Claude Code's sandbox, and a run whose commands never started measures nothing.
# The trial job is pinned to the ubuntu-24.04 image and to the Claude Code release in
# .github/scripts/install-trial-tools.sh, because a newer image or release can stop the sandbox without anything
# failing: on ubuntu-26.04, AppArmor's bwrap-userns-restrict profile keeps the sandbox's seccomp helper from starting
# any command. Before Azure and the key, the sandbox self-test (.github/scripts/sandbox-self-test.mjs) runs the trial's
# own path with a stand-in for the model on 127.0.0.1, so no model is asked and nothing is spent. It passes only when
# both agent runs its trial asks for, one with the build and one without, each ran its Bash call inside the sandbox,
# with exit 0 by Claude Code's own record and what it was asked to print: the arithmetic it was given, a seccomp filter
# on, and a user namespace other than the runner's. Otherwise the job stops there. After the trial,
# .github/scripts/shell-starts.mjs reads the eval's raw report and every agent trace. The run is a measurement only if
# they are complete, pair one trace file to one run and repeat no Bash call id, every Bash result is the command's own
# exit or a refusal made before it ran, no exit holds nothing but the sandbox's setup lines, and at least one command
# Claude Code tried to run exited 0. Otherwise the job fails and says why in its summary, and its files upload as
# not-evidence-<build>-<trial>, with the record renamed not-evidence-<build>-<trial>.json beside NOT-A-MEASUREMENT.txt.
on:
  push:
    branches: [main]
    paths: ['.github/trial-queue.json']
  workflow_dispatch:
    inputs:
      build:
        description: Build slug (bundles/<slug>)
        required: true
        default: measured-delivery
      trial:
        description: Trial slug, as published on buildguild.gg
        required: true
        default: guild-smoke-v1
      max_cost_usd:
        description: Cost ceiling in US dollars and cents for everything the run spends, at least 0.51; the key check keeps 0.5 of it and the trial gets the rest. Spend can pass it by the one reply or agent run under way when a budget is reached
        required: true
        default: "5"
      model:
        description: Model for the agent under test (pinned so a model rollout is never mistaken for a build change)
        required: true
        default: claude-sonnet-5-5
      verify_only:
        description: Only verify the vault login and key presence; run nothing
        required: false
        default: "false"
      repeat:
        description: How many times to run the build on the trial, one run after another (a whole number from 1 to 5)
        required: false
        default: "1"
permissions:
  contents: read
env:
  # A guild run uses the trial as published: the plan checks its page and the CLI downloads it from here.
  BUILDGUILD_ORIGIN: https://buildguild.gg
jobs:
  plan:
    # Outside the trials environment: it reads the queue or the inputs and needs no approval, credential or spend.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Plan one run per request
        id: plan
        env:
          BG_BUILD: ${{ inputs.build }}
          BG_TRIAL: ${{ inputs.trial }}
          BG_MAX_COST_USD: ${{ inputs.max_cost_usd }}
          BG_MODEL: ${{ inputs.model }}
          BG_VERIFY_ONLY: ${{ inputs.verify_only }}
          BG_REPEAT: ${{ inputs.repeat }}
        # Each request is checked before anyone is asked to approve it: a build that is not in bundles/, a trial the site
        # does not publish, a ceiling that is not a positive amount in dollars and cents or that leaves the trial nothing
        # once the key check's share is kept, an unknown field, a repeat that is not a whole number from 1 to 5, a second
        # request for a build and trial already requested, or two runs that would upload under one artifact name stops
        # the plan, and with it the whole workflow. A request with repeat n becomes n runs, numbered rep 1 to n; without
        # repeat it is one run.
        # The script (.github/scripts/plan-trial-runs.mjs) also splits each ceiling between the key check and the trial,
        # and writes the summary, with each ceiling times its repeats.
        run: node .github/scripts/plan-trial-runs.mjs
  trial:
    needs: plan
    # GitHub evaluates this before it expands the matrix, so an empty plan skips the job: no approval request, no Azure
    # sign-in, and the workflow ends green.
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    # Pinned, not ubuntu-latest: on ubuntu-26.04 the sandbox cannot start a command (see the header). The sandbox check
    # in .github/workflows/sandbox.yml runs on the same image, and a test keeps the two equal.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: trials
    permissions:
      contents: read
      id-token: write
    # One run at a time, repeats included. An entry from a repeated request has a rep ("1" to "5"); any other entry has
    # none, and GitHub reads a missing matrix property as an empty string, so such a run's name, files and artifact name
    # are exactly as before.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.build }} on ${{ matrix.trial }}${{ matrix.rep && format(', run {0}', matrix.rep) || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Claude Code and the Linux sandbox backend it needs for Bash-granting runs
        if: ${{ matrix.verify_only != 'true' }}
        # bubblewrap and socat, the one system setting the sandbox needs (the script names it and says why), and
        # Claude Code at the pinned release, which the script checks it really installed.
        run: bash .github/scripts/install-trial-tools.sh
      - name: Self-test the sandbox through the agent's own Bash tool, before any key or spend
        if: ${{ matrix.verify_only != 'true' }}
        env:
          BG_MODEL: ${{ matrix.model }}
        # The trial's own path, the CLI's test command and claude plugin eval with the trial's flags, on the one-case
        # trial in .github/sandbox-self-test/, against a stand-in for the model on 127.0.0.1 with a placeholder key. No
        # model is asked, nothing is spent, and the real key is not fetched until after this step. It passes only when
        # every agent run's Bash call exited 0 inside the sandbox with the expected output, and the after-trial check
        # below reads the same results from the traces. Otherwise the job stops here, before Azure. The shell starts
        # without the two token variables, as the key check's and the trial's do (see the key check).
        shell: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL bash -e {0}
        run: node .github/scripts/sandbox-self-test.mjs --model "$BG_MODEL"
      - name: Sign in to Azure with the workload identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch the Anthropic key from Key Vault (masked, never printed)
        run: |
          KEY="$(az keyvault secret show --vault-name vaultgb01 --name buildguild-anthropic-api-key --query value -o tsv 2>/dev/null || true)"
          if [ -z "$KEY" ]; then
            echo "No key found in Key Vault vaultgb01 under buildguild-anthropic-api-key; the owner puts it there."; exit 1
          fi
          echo "::add-mask::$KEY"
          echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "key present (${#KEY} characters)"
          # An organisation-level key must name a workspace on every request; a workspace-scoped key must not.
          # The id is kept aside and only sent if the key check below says it is needed.
          WS="$(az keyvault secret show --vault-name vaultgb01 --name buildguild-anthropic-workspace-id --query value -o tsv 2>/dev/null || true)"
          if [ -n "$WS" ]; then echo "::add-mask::$WS"; echo "BG_WORKSPACE_ID=$WS" >> "$GITHUB_ENV"; echo "workspace id present (sent only if the key turns out to be organisation-level)"; else echo "no workspace id in the vault"; fi
      - name: Drop the Azure session before any agent runs
        # The eval runner refuses Bash-granting runs while a cloud credential store it cannot read is present, and the
        # key is already in the job environment. Nothing after this step needs Azure.
        run: az logout 2>/dev/null || true; az account clear 2>/dev/null || true; rm -rf ~/.azure; unset AZURE_CONFIG_DIR; echo "azure session removed"
      - name: Stop here when only verifying
        if: ${{ matrix.verify_only == 'true' }}
        run: echo "vault login and key presence verified; no trial run requested"
      - name: Check the key works with one tiny call
        if: ${{ matrix.verify_only != 'true' }}
        env:
          BG_MODEL: ${{ matrix.model }}
          BG_KEY_CHECK_BUDGET_USD: ${{ matrix.key_check_budget_usd }}
        # The runner gives every run step of this job ACTIONS_ID_TOKEN_REQUEST_TOKEN, the job's own access token, and
        # ACTIONS_ID_TOKEN_REQUEST_URL; together they get a new sign-in token that Azure accepts for this job's
        # identity. This step and the run start their shell through env -u, which drops both before the shell starts,
        # so neither the shell nor anything it starts (Claude Code, the agent under test, the build's hooks and tools)
        # holds them, in its own environment or in the starting environment another process can read. Not prevented:
        # code that uses the runner's passwordless sudo can read them from the runner's memory, and later steps
        # receive them again. Otherwise the shell is GitHub's default, bash -e, so each step fails as before.
        # Each call gets the budget the plan set for one key check, and the plan keeps two such budgets out of the
        # trial's share of the ceiling. A call shows the key works only when it exits 0 and its standard output is the
        # reply asked for: the word ok, in any case, with surrounding whitespace and one closing . or ! allowed.
        # Standard error is shown but never read as a reply, and a working reply is not searched for error words. Any
        # other call stops the job here, before the trial; its message says which kind it was: an organisation-level key
        # (tried once more with the workspace header, held to the same test, and the header is kept only after a working
        # reply), the budget reached (Claude Code 2.1.321 prints "Error: Exceeded USD budget (<budget>)" instead of the
        # reply and exits 1), an API error or no login, any other error, or exit 0 without that reply.
        shell: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL bash -e {0}
        run: |
          if [ -z "$BG_KEY_CHECK_BUDGET_USD" ]; then echo "the plan gave the key check no budget; stopping before any trial run"; exit 1; fi
          ERRFILE="$(mktemp)"
          trap 'rm -f "$ERRFILE"' EXIT
          key_check() { # one budgeted call: ANSWER is its standard output, STATUS its exit status, LOG its last three lines with standard error first
            STATUS=0
            ANSWER="$(claude -p "Reply with the single word ok." --model "$BG_MODEL" --max-turns 1 --max-budget-usd "$BG_KEY_CHECK_BUDGET_USD" 2>"$ERRFILE")" || STATUS=$?
            LOG="$( { cat "$ERRFILE"; printf '%s\n' "$ANSWER"; } | tail -3)"
            echo "$LOG"
          }
          works() { # exit status 0 and the reply ok
            local word="$ANSWER"
            word="${word#"${word%%[![:space:]]*}"}"
            word="${word%"${word##*[![:space:]]}"}"
            word="${word%[.!]}"
            [ "$STATUS" -eq 0 ] && case "$word" in [Oo][Kk]) true;; *) false;; esac
          }
          stop_check() { # $1 is "with the header" for the retry; says why the call did not show a working key, then stops the job
            case "$LOG" in
              *"USD budget"*|*"maximum budget"*) echo "the key check reached its budget of $BG_KEY_CHECK_BUDGET_USD USD before the key was shown to work; stopping before any trial run";;
              *"API Error"*|*"Not logged in"*) if [ -n "$1" ]; then echo "the key does not work with the header either; stopping"; else echo "the key does not work; stopping before any trial run"; fi;;
              *) if [ "$STATUS" -ne 0 ]; then echo "the key check${1:+ $1} ended in an error (exit status $STATUS); stopping before any trial run"
                 else
                   case "$ANSWER" in *[![:space:]]*) GOT="[$ANSWER]";; *) GOT="empty or only whitespace";; esac
                   echo "the key check${1:+ $1} exited 0 without the reply asked for, the word ok; its standard output was $GOT; stopping before any trial run"
                 fi;;
            esac
            exit 1
          }
          key_check
          if ! works; then
            case "$LOG" in
              *"not scoped to a workspace"*)
                if [ -z "${BG_WORKSPACE_ID:-}" ]; then echo "organisation-level key and no workspace id in the vault; stopping"; exit 1; fi
                echo "organisation-level key: retrying with the workspace header"
                export ANTHROPIC_CUSTOM_HEADERS="anthropic-workspace-id: $BG_WORKSPACE_ID"
                key_check
                if ! works; then stop_check "with the header"; fi
                echo "ANTHROPIC_CUSTOM_HEADERS=anthropic-workspace-id: $BG_WORKSPACE_ID" >> "$GITHUB_ENV";;
              *) stop_check "";;
            esac
          fi
      - name: Run the trial
        id: run
        if: ${{ matrix.verify_only != 'true' }}
        env:
          BG_BUILD: ${{ matrix.build }}
          BG_TRIAL: ${{ matrix.trial }}
          BG_TRIAL_BUDGET_USD: ${{ matrix.trial_budget_usd }}
          BG_MODEL: ${{ matrix.model }}
          BG_CONCURRENCY: ${{ matrix.concurrency }}
          BG_REP: ${{ matrix.rep }}
        # The eval creates each run's home and workspace under the system temp directory. Inside the sandbox /tmp is
        # replaced, which left the workspace read-only on this runner, so the temp directory is moved under the runner's
        # own work area. The CLI downloads the published trial from BUILDGUILD_ORIGIN and stops, saying so, if it cannot.
        # The shell starts without the two token variables, as the key check above explains. A run of a repeated request
        # passes --rep, which ends the evidence id in -rep<k>, and its file names end the same way; any other run passes
        # neither. The trial's ceiling is the plan's trial_budget_usd, the request's max_cost_usd less the key check's
        # reserve; the eval checks it before each agent run starts.
        shell: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL bash -e {0}
        run: |
          if [ -z "$BG_TRIAL_BUDGET_USD" ]; then echo "the plan gave the trial no budget; stopping"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/evaltmp" && export TMPDIR="$RUNNER_TEMP/evaltmp"
          SUFFIX="${BG_REP:+-rep$BG_REP}"
          REP_ARGS=()
          if [ -n "$BG_REP" ]; then REP_ARGS=(--rep "$BG_REP"); fi
          node cli/buildguild.mjs test "bundles/$BG_BUILD" --trial "$BG_TRIAL" --max-cost-usd "$BG_TRIAL_BUDGET_USD" --model "$BG_MODEL" -j "$BG_CONCURRENCY" --runner github-actions --role guild --out "evidence-$BG_BUILD-$BG_TRIAL$SUFFIX.json" --raw-out "raw-$BG_BUILD-$BG_TRIAL$SUFFIX.json" --work-dir "$RUNNER_TEMP/trial-run" --keep-temp "${REP_ARGS[@]}"
      - name: Check that the sandbox started the agents' shell commands
        id: shells
        if: ${{ always() && matrix.verify_only != 'true' && steps.run.outcome != 'skipped' }}
        env:
          BG_BUILD: ${{ matrix.build }}
          BG_TRIAL: ${{ matrix.trial }}
          BG_REP: ${{ matrix.rep }}
        # The rule, in .github/scripts/shell-starts.mjs, on the raw report the run step wrote and every agent trace. The
        # run is not a measurement when (a) the report or the traces are incomplete or do not pair one trace to one run,
        # two run folders hold one trace file through a link, a Bash call id appears more than once as a request or a
        # result, or a Bash request has no result. A run cut off in the middle of a shell command is rejected and has to
        # run again. (b) A Bash result is an error that is not a process exit: in Claude Code 2.1.322 a command that ran
        # and exited non-zero is the one error whose text begins "Exit code <n>". Every other error counts, except three
        # refusals made before a command runs: a PreToolUse hook refused the call, the model's input failed validation,
        # or Claude Code blocked a long sleep. (c) A Bash result is a process exit with nothing but the sandbox
        # wrapper's own setup lines, shaped like "bwrap: <message>" or "apply-seccomp: <step>: <error>", plus bash's
        # complaints. (d) Claude Code tried to run shell commands for the agents and not one of them exited 0. A grep
        # that found nothing, which Claude Code reads as success, and a command it ran in the background, as it does
        # when a command runs past its timeout, do not count; its own record of each result in the trace says which.
        # Limits: (c) also counts a command that started and printed nothing but such lines, which can only reject a
        # run, never accept one; and a wrapper failure that exits with a status, prints something besides those shapes
        # and hits only some commands is not detected here, nor is one that hits only commands run in the background
        # (the self-test and the pins guard against it). Any of these fails the job, says why in the job summary, and
        # the files below upload as not-evidence-<build>-<trial>. Scope: this check and the self-test guard against a
        # fault in the environment, such as an image, a release, a bridge or a crash that keeps commands from starting
        # or cuts the report or traces short, not against someone who can write the eval's report and traces, who could
        # write the grades too; a forged record, one no Claude Code release writes, is outside what they check.
        run: node .github/scripts/shell-starts.mjs "$RUNNER_TEMP/evaltmp" "raw-$BG_BUILD-$BG_TRIAL${BG_REP:+-rep$BG_REP}.json"
      - name: Gather the files to upload
        if: ${{ always() && matrix.verify_only != 'true' }}
        env:
          BG_BUILD: ${{ matrix.build }}
          BG_TRIAL: ${{ matrix.trial }}
          BG_REP: ${{ matrix.rep }}
          BG_MEASUREMENT: ${{ steps.shells.outputs.measurement }}
          BG_WHY_NOT: ${{ steps.shells.outputs.sentence }}
        # One folder holds exactly what is uploaded. It starts empty, and copies follow links, so the scan reads the
        # bytes the upload sends. Only a run the check above called a measurement uploads its record under its own name.
        # Any other run's record is renamed not-evidence-…, beside NOT-A-MEASUREMENT.txt saying why, and the upload
        # below takes the same not- prefix, so neither can pass for a measurement.
        run: |
          OUT_DIR="$RUNNER_TEMP/upload"
          SUFFIX="${BG_REP:+-rep$BG_REP}"
          EVIDENCE="evidence-$BG_BUILD-$BG_TRIAL$SUFFIX.json"
          if [ "$BG_MEASUREMENT" = "true" ]; then KEPT="$EVIDENCE"; else KEPT="not-$EVIDENCE"; fi
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          if [ -f "$EVIDENCE" ]; then cp -L "$EVIDENCE" "$OUT_DIR/$KEPT"; fi
          if [ -f "raw-$BG_BUILD-$BG_TRIAL$SUFFIX.json" ]; then cp -L "raw-$BG_BUILD-$BG_TRIAL$SUFFIX.json" "$OUT_DIR/"; fi
          if [ -d "$RUNNER_TEMP/trial-run/evals/results" ]; then cp -RL "$RUNNER_TEMP/trial-run/evals/results" "$OUT_DIR/results"; fi
          for trace in "$RUNNER_TEMP"/evaltmp/claude-eval-*/out/trace.jsonl; do
            if [ -f "$trace" ]; then
              run_dir="$(basename "$(dirname "$(dirname "$trace")")")"
              mkdir -p "$OUT_DIR/traces/$run_dir" && cp -L "$trace" "$OUT_DIR/traces/$run_dir/"
            fi
          done
          if [ "$BG_MEASUREMENT" != "true" ] && [ -n "$(find "$OUT_DIR" -mindepth 1)" ]; then
            printf '%s\n' "${BG_WHY_NOT:-This run was never checked for shell commands the sandbox kept from starting.}" "Nothing in this upload is evidence: these files are for working out what went wrong. Do not submit or import them." > "$OUT_DIR/NOT-A-MEASUREMENT.txt"
            echo "Once scanned, its files upload as not-evidence-$BG_BUILD-$BG_TRIAL$SUFFIX, for working out what went wrong only." >> "$GITHUB_STEP_SUMMARY"
          fi
          (cd "$OUT_DIR" && find . -type f | sort)
      - name: Scan the files for the key before anything is uploaded
        id: scan
        if: ${{ always() && matrix.verify_only != 'true' }}
        # GitHub masks the key in logs but not in uploaded files, which anyone signed in to GitHub can download from a
        # public repository. The job fails and nothing is uploaded if the folder is itself a link or holds anything but
        # regular files and folders (the upload follows links; find and grep do not), or if the key or the workspace id
        # is in a file or in a file or folder name. The log names the paths, with those values blanked out.
        run: |
          OUT_DIR="$RUNNER_TEMP/upload"
          if [ -L "$OUT_DIR" ]; then echo "::error::the upload folder is itself a link, which the upload would follow; nothing is uploaded"; exit 1; fi
          if [ -z "$(find "$OUT_DIR" -mindepth 1 2>/dev/null)" ]; then echo "no files to upload"; exit 0; fi
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then echo "::error::the key is not in this job, so the files cannot be checked; nothing is uploaded"; exit 1; fi
          found=0
          report() { # $1 says what failed; the rest are the paths behind it
            local path
            echo "::error::$1; nothing is uploaded"
            shift
            for path in "$@"; do
              path="${path#"$OUT_DIR"/}"
              path="${path//"$ANTHROPIC_API_KEY"/[key]}"
              if [ -n "${BG_WORKSPACE_ID:-}" ]; then path="${path//"$BG_WORKSPACE_ID"/[workspace id]}"; fi
              printf '  %s\n' "$path"
            done
            found=1
          }
          mapfile -d '' others < <(find "$OUT_DIR" -mindepth 1 ! -type f ! -type d -print0)
          if [ "${#others[@]}" -gt 0 ]; then report "these are neither regular files nor folders" "${others[@]}"; exit 1; fi
          mapfile -d '' entries < <(find "$OUT_DIR" -mindepth 1 -print0)
          check() { # $1 names the value, $2 is the value
            local entry named=() files paths=() status=0
            for entry in "${entries[@]}"; do
              if [[ "${entry#"$OUT_DIR"/}" == *"$2"* ]]; then named+=("$entry"); fi
            done
            if [ "${#named[@]}" -gt 0 ]; then report "$1 is in these file or folder names" "${named[@]}"; fi
            # grep exits 0 on a match, 1 on none, 2 if a file cannot be read.
            files="$(grep -rlF -e "$2" -- "$OUT_DIR")" || status=$?
            if [ -n "$files" ]; then mapfile -t paths <<< "$files"; fi
            if [ "$status" -ne 1 ]; then report "$1 is in these files, or one could not be read" "${paths[@]}"; fi
          }
          check "the key" "$ANTHROPIC_API_KEY"
          if [ -n "${BG_WORKSPACE_ID:-}" ]; then check "the workspace id" "$BG_WORKSPACE_ID"; fi
          if [ "$found" -ne 0 ]; then exit 1; fi
          echo "only regular files and folders, and neither the key nor the workspace id in any name or file"
      - name: Upload the scanned files
        if: ${{ always() && matrix.verify_only != 'true' && steps.scan.outcome == 'success' }}
        # Each run's artifact needs its own name, or its upload fails. The plan builds this name the same way
        # (artifactName in .github/scripts/plan-trial-runs.mjs, kept in step by a test) and refuses two runs that would
        # share one. A run the check above did not call a measurement uploads under the same name with not- in front.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.shells.outputs.measurement != 'true' && 'not-' || '' }}evidence-${{ matrix.build }}-${{ matrix.trial }}${{ matrix.rep && format('-rep{0}', matrix.rep) || '' }}
          path: ${{ runner.temp }}/upload/
          if-no-files-found: warn
